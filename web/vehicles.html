<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles Management - Vehicle Rental Management System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-wrapper">
                    <div class="brand-icon">🚗</div>
                    <div>
                        <div class="brand-title">DriveX Rentals</div>
                        <div class="brand-sub">KTU S3 OOP Project</div>
                    </div>
                </div>
                <button class="sidebar-close-btn" onclick="closeMobileMenu()">&times;</button>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="index.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item active">
                    <a href="vehicles.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                        <span>Vehicles</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="customers.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5 5 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                        <span>Customers</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="rent.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>Rent Vehicle</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="return.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        <span>Return Vehicle</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="history.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                        <span>Rental History</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <div class="nav-left">
                    <button class="hamburger-btn" onclick="toggleMobileMenu()" aria-label="Toggle Menu">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="page-title">
                        <h1>Vehicle Fleet</h1>
                        <p>View, add, edit, and manage all rental vehicles</p>
                    </div>
                </div>
                <div class="nav-actions">
                    <button class="btn btn-primary" onclick="openAddModal()">+ Add</button>
                </div>
            </header>

            <div class="content-body">
                <div class="table-container">
                    <div class="table-toolbar">
                        <div class="search-box">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="vehicle-search" placeholder="Search by name, code, or number...">
                        </div>
                        <div class="filter-group">
                            <select id="filter-type" class="filter-select">
                                <option value="ALL">All Types</option>
                                <option value="Car">Cars</option>
                                <option value="Bike">Bikes</option>
                                <option value="Truck">Trucks</option>
                            </select>
                            <select id="filter-availability" class="filter-select">
                                <option value="ALL">All Status</option>
                                <option value="AVAILABLE">Available</option>
                                <option value="RENTED">Rented</option>
                            </select>
                        </div>
                    </div>

                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Vehicle Name</th>
                                <th>Type</th>
                                <th>Vehicle Number</th>
                                <th>Rent / Day</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="vehicles-table-body">
                            <!-- Populated dynamically via vehicles.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Add / Edit Vehicle -->
    <div class="modal-overlay" id="vehicle-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Add New Vehicle</h3>
                <button class="close-btn" onclick="closeModal('vehicle-modal')">&times;</button>
            </div>
            <form id="vehicle-form">
                <div class="modal-body">
                    <input type="hidden" id="vehicle-id">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="v-code">Vehicle Code *</label>
                            <input type="text" id="v-code" class="form-control" placeholder="e.g. V104" required>
                        </div>
                        <div class="form-group">
                            <label for="v-type">Vehicle Type *</label>
                            <select id="v-type" class="form-control" required>
                                <option value="Car">Car</option>
                                <option value="Bike">Bike</option>
                                <option value="Truck">Truck</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="v-name">Vehicle Name *</label>
                        <input type="text" id="v-name" class="form-control" placeholder="e.g. Hyundai Creta" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="v-number">Registration Number *</label>
                            <input type="text" id="v-number" class="form-control" placeholder="e.g. KL 07 CZ 9999" required>
                        </div>
                        <div class="form-group">
                            <label for="v-rent">Rent Per Day (₹) *</label>
                            <input type="number" id="v-rent" class="form-control" placeholder="e.g. 1800" min="1" step="0.01" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('vehicle-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Vehicle</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/vehicles.js"></script>
</body>
</html>
